  - name: DIM_LINEITEM
    description: Line item table sourced from the staging layer, enriched with total price, discount-adjusted price, and status labels. Only valid rows (shipped, positive quantity) are included.
    config:
      materialized: table
      persist_docs: 
        relation: true
        columns: true
      freshness: 
        build_after: 
          count: 4
          period: hour
          updates_on: any
      docs:
        show: true
      access: protected
      tags:
        - tpch
        - dimension
        - intermediate
    columns:
      - name: ORDERKEY
        description: Foreign key referencing the order.
        data_tests:
          - not_null
      - name: LINENUMBER
        description: Line item number within an order.
        data_tests:
          - not_null
      - name: PARTKEY
        description: Foreign key referencing the part.
        data_tests:
          - relationships: 
              field: PARTKEY
              to: ref('DIM_PART')
      - name: SUPPKEY
        description: Foreign key referencing the supplier.
        data_tests:
          - relationships: 
              field: SUPPLIERKEY
              to: ref('DIM_SUPPLIER')
      - name: QUANTITY
        description: Quantity of the item ordered.
      - name: EXTENDEDPRICE
        description: Extended price of the item.
        config:
          tags:
            - measure
      - name: DISCOUNT
        description: Discount applied to the item.
      - name: TAX
        description: Tax applied to the item.
      - name: RETURNFLAG
        description: Return status of the item.
        data_tests:
          - accepted_values: 
              values: ['A', 'N', 'R']
      - name: LINESTATUS
        description: Status code of the line item (O = open, F/C = complete).
      - name: SHIPDATE
        description: Date the item was shipped.
      - name: COMMITDATE
        description: Date the item was committed for shipping.
      - name: RECEIPTDATE
        description: Date the item was received.
      - name: SHIPINSTRUCT
        description: Shipping instructions for the item.
      - name: SHIPMODE
        description: Shipping mode for the item.
      - name: COMMENT
        description: Free-text comment field carried over from the source system.
      - name: LOAD_TIMESTAMP
        description: Timestamp indicating when this record was loaded into the model.
      - name: TOTAL_PRICE
        description: Calculated as QUANTITY * EXTENDEDPRICE.
        config:
          tags:
            - measure
      - name: ADJUSTED_PRICE
        description: 'Extended price after discount: EXTENDEDPRICE * (1 - DISCOUNT / 100).'
        config:
          tags:
            - measure
      - name: ROW_STATUS
        description: Row validity flag; only 'Valid' rows (SHIPDATE not null and QUANTITY > 0) are kept.
      - name: LINEITEM_STATUS
        description: Descriptive line status derived from LINESTATUS (Open, Complete, Pending).
        data_tests:
          - accepted_values: 
              values: ['Open', 'Complete', 'Pending']
              config: 
                severity: warn

