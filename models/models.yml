  - name: DIM_CUSTOMER
    description: Customer dimension table, cleansed and standardized from the staging layer. Applies name casing, address trimming, phone normalization, and account balance rounding for downstream reporting and analytics.
    config:
      materialized: view
      persist_docs: 
        relation: true
        columns: true
      docs:
        show: true
      access: protected
      tags:
        - tpch
        - dimension
        - intermediate
        - pii
    columns:
      - name: CUSTKEY
        description: Unique identifier for the customer. Primary key of this dimension.
        data_tests:
          - not_null
          - unique
      - name: CUSTOMER_NAME
        description: Customer's full name, standardized to uppercase for consistent matching and display.
        config:
          tags:
            - pii
      - name: ADDRESS
        description: Customer's mailing address, trimmed of leading/trailing whitespace.
        config:
          tags:
            - pii
      - name: NATIONKEY
        description: Foreign key referencing the nation the customer is associated with.
        data_tests:
          - relationships: 
              field: NATIONKEY
              to: ref('DIM_NATION')
      - name: PHONE
        description: Customer's phone number with all non-numeric characters removed.
        config:
          tags:
            - pii
      - name: ACCOUNT_BALANCE
        description: Customer's account balance, rounded to 2 decimal places.
        config:
          tags:
            - measure
      - name: MARKET_SEGMENT
        description: Market segment the customer belongs to (e.g. AUTOMOBILE, BUILDING, FURNITURE, MACHINERY, HOUSEHOLD).
        data_tests:
          - accepted_values: 
              values: ['AUTOMOBILE', 'BUILDING', 'FURNITURE', 'HOUSEHOLD', 'MACHINERY']
      - name: COMMENT
        description: Free-text comment field carried over from the source system.
      - name: LOAD_TIMESTAMP
        description: Timestamp indicating when this record was loaded into the model.

  - name: FACT_LINEITEM
    description: Line item fact table joining line items to supplier, part, and customer attributes (customer resolved through the order), with discounted price, shipping duration, and a high/low value category.
    config:
      freshness: 
        build_after: 
          count: 4
          period: hour
          updates_on: any
      docs:
        show: true
      access: protected
      tags:
        - tpch
        - fact
        - marts
        - finance
    columns:
      - name: ORDERKEY
        description: Foreign key referencing the order.
        data_tests:
          - not_null
      - name: LINENUMBER
        description: Line item number within an order.
        data_tests:
          - not_null
      - name: PARTKEY
        description: Foreign key referencing the part.
        data_tests:
          - relationships: 
              field: PARTKEY
              to: ref('DIM_PART')
              config: 
                severity: warn
      - name: SUPPKEY
        description: Foreign key referencing the supplier.
        data_tests:
          - relationships: 
              field: SUPPLIERKEY
              to: ref('DIM_SUPPLIER')
              config: 
                severity: warn
      - name: CUSTKEY
        description: Foreign key referencing the customer who placed the order (via STG_ORDERS).
        data_tests:
          - relationships: 
              field: CUSTKEY
              to: ref('DIM_CUSTOMER')
              config: 
                severity: warn
      - name: QUANTITY
        description: Quantity of the item ordered.
      - name: EXTENDEDPRICE
        description: Extended price of the item.
        config:
          tags:
            - measure
      - name: DISCOUNT
        description: Discount applied to the item.
      - name: TAX
        description: Tax applied to the item.
      - name: RETURNFLAG
        description: Return status of the item.
      - name: LINESTATUS
        description: Status code of the line item.
      - name: SHIPDATE
        description: Date the item was shipped.
        data_tests:
          - not_null
      - name: COMMITDATE
        description: Date the item was committed for shipping.
      - name: RECEIPTDATE
        description: Date the item was received.
      - name: SHIPINSTRUCT
        description: Shipping instructions for the item.
      - name: SHIPMODE
        description: Shipping mode for the item.
        data_tests:
          - accepted_values: 
              values: ['AIR', 'FOB', 'MAIL', 'RAIL', 'REG AIR', 'SHIP', 'TRUCK']
              config: 
                severity: warn
                store_failures: true
      - name: SUPPLIERNAME
        description: Supplier name (uppercase), from DIM_SUPPLIER.
        config:
          tags:
            - pii
      - name: SUPPLIER_ADDRESS
        description: Supplier address, from DIM_SUPPLIER.
        config:
          tags:
            - pii
      - name: SUPPLIER_PHONE
        description: Supplier phone number (digits only), from DIM_SUPPLIER.
        config:
          tags:
            - pii
      - name: PART_NAME
        description: Part name, from DIM_PART.
      - name: PART_KEY
        description: Part key from DIM_PART (same value as PARTKEY when the part matches).
      - name: PART_MFGR
        description: Part manufacturer, from DIM_PART.
      - name: PART_BRAND
        description: Part brand, from DIM_PART.
      - name: PART_TYPE
        description: Part type, from DIM_PART.
      - name: PART_SIZE
        description: Part size, from DIM_PART.
      - name: PART_CONTAINER
        description: Part container type, from DIM_PART.
      - name: PART_RETAILPRICE
        description: Part retail price, from DIM_PART.
        config:
          tags:
            - measure
      - name: CUSTOMER_NAME
        description: Customer name (uppercase), from DIM_CUSTOMER.
        config:
          tags:
            - pii
      - name: CUSTOMER_ADDRESS
        description: Customer address, from DIM_CUSTOMER.
        config:
          tags:
            - pii
      - name: CUSTOMER_PHONE
        description: Customer phone number (digits only), from DIM_CUSTOMER.
        config:
          tags:
            - pii
      - name: LOAD_TIMESTAMP
        description: Timestamp indicating when this record was loaded into the model.
      - name: DISCOUNTED_PRICE
        description: 'Extended price after discount: EXTENDEDPRICE * (1 - DISCOUNT).'
        data_tests:
          - not_null
        config:
          tags:
            - measure
      - name: SHIP_TO_RECEIPT_DAYS
        description: Number of days between SHIPDATE and RECEIPTDATE.
      - name: ITEM_VALUE_CATEGORY
        description: "'High Value' when DISCOUNTED_PRICE > 1000, otherwise 'Low Value'."
        data_tests:
          - accepted_values: 
              values: ['High Value', 'Low Value']
              config: 
                where: SHIPDATE >= '1995-01-01'
