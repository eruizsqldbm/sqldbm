          - name: DISCOUNT
            description: Percentage discount applied to the line item
          - name: TAX
            description: Tax rate applied to the line item
          - name: RETURNFLAG
            description: RETURNFLAG is a flag column that indicates the return status of an order item. It typically contains values such as 'R' for returned items, 'N' for not returned, or similar status codes used to track whether ordered items have been returned or not.
          - name: LINESTATUS
            description: Status of the line item (e.g., shipped, pending)
          - name: SHIPDATE
            description: Date when the line item was shipped
          - name: COMMITDATE
            description: Promised delivery date for the line item
          - name: RECEIPTDATE
            description: Date when the line item was received
          - name: SHIPINSTRUCT
            description: Special shipping instructions for the line item
          - name: SHIPMODE
            description: Mode of shipping for the line item
          - name: SUPPLIERNAME
            description: Name of the supplier for this line item
